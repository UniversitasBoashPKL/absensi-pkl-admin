<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Admin - List Absensi PKL</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    #tabelTabel td, #tabelTabel th { font-size:14px; }
    .thumb { width:50px; border-radius:4px; border:1px solid #ccc; }
  </style>
</head>
<body>
<header>
  <h1>📋 List Absensi Siswa PKL</h1>
  <small style="color:#cfe0ff">Hanya admin yang dapat melihat — link rahasia</small>
</header>
<main>
  <h2>Data Absensi</h2>
  <button id="ekspor" style="margin-bottom:15px">📥 Ekspor ke Excel</button>
  <button id="muatUlang" style="background:#2E5395;margin-bottom:15px">🔄 Muat Ulang</button>
  <table id="tabelTabel">
    <thead>
      <tr><th>No</th><th>Nama</th><th>Waktu</th><th>Asal Sekolah</th><th>Koordinat GPS</th><th>Status</th><th>Foto</th></tr>
    </thead>
    <tbody id="listAbsen"></tbody>
  </table>
</main>
<footer>Sistem Absensi Jam Kerja PKL &copy; 2026</footer>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDHCN6nzqVYAjrataDYnhDREgElZa0x94E",
  authDomain: "pklboash-5157f.firebaseapp.com",
  projectId: "pklboash-5157f",
  storageBucket: "pklboash-5157f.firebasestorage.app",
  messagingSenderId: "8124585594",
  appId: "1:8124585594:web:c9dd9f188fa8b306ff0dc3"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let semuaData = [];

async function muat() {
  const tbody = document.getElementById('listAbsen');
  tbody.innerHTML = '<tr><td colspan="7" style="text-align:center">Memuat...</td></tr>';
  try {
    const snap = await db.collection('absensi').orderBy('dibuat', 'desc').get();
    semuaData = [];
    snap.forEach(doc => semuaData.push(doc.data()));
    tbody.innerHTML = semuaData.length === 0
      ? '<tr><td colspan="7" style="text-align:center">Belum ada data absensi.</td></tr>' : '';
    semuaData.forEach((d, i) => {
      tbody.innerHTML += `<tr>
        <td>${i+1}</td>
        <td>${d.nama}</td>
        <td>${d.waktu}</td>
        <td>${d.sekolah}</td>
        <td>${d.lokasi ? '<a href="https://www.google.com/maps?q='+d.lokasi+'" target="_blank">'+d.lokasi+'</a>' : '-'}</td>
        <td>${d.status}</td>
        <td>${d.foto ? '<img class="thumb" src="'+d.foto+'">' : '-'}</td>
      </tr>`;
    });
  } catch (e) { tbody.innerHTML = '<tr><td colspan="7">Gagal: '+e.message+'</td></tr>'; }
}
document.getElementById('muatUlang').addEventListener('click', muat);
document.getElementById('ekspor').addEventListener('click', function(){
  if(semuaData.length===0){alert('Belum ada data.');return;}
  const rows = semuaData.map((d,i)=>({No:i+1,Nama:d.nama,Waktu:d.waktu,'Asal Sekolah':d.sekolah,'Koordinat GPS':d.lokasi||'-',Status:d.status}));
  const ws=XLSX.utils.json_to_sheet(rows);
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'List Absensi');
  XLSX.writeFile(wb,'List_Absensi_PKL.xlsx');
});
window.addEventListener('load', muat);
</script>
</body>
</html>
